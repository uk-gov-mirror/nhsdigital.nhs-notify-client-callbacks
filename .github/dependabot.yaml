version: 2

updates:

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "daily"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    exclude-paths:
      - "docs/adr/assets/ADR-003/examples/**"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "daily"
    exclude-paths:
      - "docs/adr/assets/ADR-003/examples/**"

  - package-ecosystem: "terraform"
    directory: "/"
    schedule:
      interval: "daily"
